name: sync-upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 合并上游（先不推送）
        id: merge
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/autummu2/HoyoCalendar.git
          git fetch upstream main

          before=$(git rev-parse HEAD)
          if ! git merge upstream/main --no-edit; then
            git merge --abort || true
            echo "::error::与 upstream/main 合并冲突，需要人工处理"
            exit 1
          fi
          after=$(git rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无新提交，跳过门禁与推送。"
            exit 0
          fi

          # GITHUB_TOKEN 无权推送 .github/workflows/ 下的变更，
          # 上游新增 maintain.yml 后 push 会被拒。fork 只保留自己的 workflow。
          git checkout "$before" -- .github/workflows/
          added=$(git diff --name-only --diff-filter=A "$before" -- .github/workflows/ || true)
          if [ -n "$added" ]; then
            echo "以下上游新增 workflow 不进入 fork："
            echo "$added"
            echo "$added" | xargs -r git rm -f --
          fi
          if ! git diff --cached --quiet -- .github/workflows/; then
            git commit --amend --no-edit
            after=$(git rev-parse HEAD)
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "上游有新提交：$before → $after"

      - name: 安装依赖
        if: steps.merge.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund

      - name: 校验活动数据
        if: steps.merge.outputs.changed == 'true'
        run: node scripts/validate-data.mjs

      - name: lint / test / build 门禁
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm run lint
          npm test
          npm run build

      - name: 推送到 fork（触发 Pages 自动部署）
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: 失败告警（自动开 / 更新 Issue）
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[镜像] 上游同步失败';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '上游同步或门禁未通过，镜像可能停留在旧数据。',
              '',
              `- 运行记录：${runUrl}`,
              `- 触发方式：${context.eventName}`,
              `- 时间：${new Date().toISOString()}`,
              '',
              '常见原因：与 upstream/main 合并冲突，或 lint / test / build / 数据校验失败。',
            ].join('\n');
            try {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100,
              });
              const existing = issues.find((i) => i.title === title && !i.pull_request);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
              }
            } catch (err) {
              core.warning(`无法创建 Issue（仓库可能已禁用 Issues）：${err.message}`);
              core.warning(body);
            }

      - name: 失败告警（可选 webhook，兼容 Bark 格式）
        if: failure() && env.NOTIFY_WEBHOOK != ''
        continue-on-error: true
        run: |
          jq -n \
            --arg title "HoyoCalendar 镜像同步失败" \
            --arg body "检查 GitHub Actions 运行记录" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{title:$title, body:$body, url:$url}' \
          | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$NOTIFY_WEBHOOK"

      - name: 同步恢复后自动关闭告警 Issue
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[镜像] 上游同步失败';
            try {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100,
              });
              for (const i of issues.filter((x) => x.title === title && !x.pull_request)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: i.number, body: '上游同步已恢复正常，自动关闭。',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: i.number, state: 'closed',
                });
              }
            } catch (err) {
              core.warning(`跳过关闭 Issue（仓库可能已禁用 Issues）：${err.message}`);
            }
